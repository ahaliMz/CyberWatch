name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run unit tests
        shell: cmd
        run: build.cmd test

      - name: Verify MSBuild project compilation
        shell: cmd
        run: '"%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" Cyberwatch.csproj /p:Configuration=Release /t:Rebuild || C:\Windows\Microsoft.NET\Framework64\v4.0.30319\MSBuild.exe Cyberwatch.csproj /p:Configuration=Release /t:Rebuild'

